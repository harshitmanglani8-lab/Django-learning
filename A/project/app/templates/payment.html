<!DOCTYPE html>
<html>
<head>
    <title>Buy Product</title>

    <style>

        body{
            margin:0;
            padding:0;
            font-family:Arial;
            background:#f5f5f5;
        }

        .container{

            width:400px;
            margin:80px auto;
            background:white;
            padding:20px;
            border-radius:10px;
            box-shadow:0px 0px 10px gray;
            text-align:center;
        }

        .product-image{

            width:100%;
            height:250px;
            object-fit:cover;
            border-radius:10px;
        }

        h1{
            color:#333;
        }

        p{
            color:gray;
            font-size:18px;
        }

        .price{
            font-size:25px;
            color:green;
            font-weight:bold;
        }

        button{

            background:#3399cc;
            color:white;
            border:none;
            padding:15px 30px;
            font-size:18px;
            border-radius:8px;
            cursor:pointer;
        }

        button:hover{
            background:#287aa3;
        }

    </style>
</head>

<body>

    <div class="container">

        <img 
        src="https://images.unsplash.com/photo-1542291026-7eec264c27ff"
        class="product-image">

        <h1>Nike Shoes</h1>

        <p>
            Comfortable running shoes for daily use
        </p>

        <div class="price">
            ₹500
        </div>

        <br><br>
        <form action="/payment/" method="POST">
            {% csrf_token %}
            <script         
                src="https://checkout.razorpay.com/v1/checkout.js"
                data-key="{{ razorpay_key }}"
                data-amount="{{ payment.amount }}"
                data-currency="INR"
                data-order_id="{{ payment.id }}"
                data-buttontext="Buy Now"
                data-name="My Django Shop"
                data-description="Purchase Product"
                data-theme.color="#3399cc">
            </script>
        </form>
    </div>
</body>
</html>
