{{age}}

<!-- if else -->
{% if age > 18 %}
<h2>You are eligible for vote</h2>
{% else %}
<h2>You are not eligible for vote</h2>
{% endif %}

<!-- elif -->
{% if age > 18 %}
<h2>You are eligible for vote</h2>
{% elif age == 18 %}
<h2>get ready to give the vote</h2>
{% else %}
<h2>You are not eligible for vote</h2>
{% endif %}
